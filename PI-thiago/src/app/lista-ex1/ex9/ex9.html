<h2>Exercício 9 - Controle de estoque</h2>

<p>
  <label>Produto:</label><br>
  <input type="text" [(ngModel)]="produto">
</p>

<p>Produto: {{ produto }}</p>

<p>Estoque: {{ estoque }}</p>

<button (click)="diminuir()" [disabled]="estoque === 0">
  -
</button>

<button (click)="aumentar()">
  +
</button>
